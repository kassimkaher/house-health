# Throwaway data services for integration tests. Distinct ports from dev so
# both stacks can coexist. No volumes — state dies with the containers.
name: hh-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hh_test
      POSTGRES_PASSWORD: hh_test
      POSTGRES_DB: health_house_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hh_test -d health_house_test"]
      interval: 3s
      timeout: 3s
      retries: 15
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
    mem_limit: 128m

  minio:
    image: minio/minio:latest
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: hh_test
      MINIO_ROOT_PASSWORD: hh_test_secret
    ports:
      - "127.0.0.1:9002:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 256m
