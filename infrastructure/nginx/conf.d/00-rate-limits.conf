# Loaded first (numeric prefix) since limit_req_zone must be defined before
# any server block references it. Defense-in-depth alongside the app-level
# @nestjs/throttler limits — this catches abuse before it reaches Node at all.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=2r/s;
