# admin.<domain> — proxies to the Next.js admin-web container. Cookie-based
# auth (docs/security-privacy.md) relies on this being a distinct origin
# from api.<domain> — do not collapse api+admin onto one server block.
# HTTP-only version; scripts/enable-tls.sh installs admin.conf.https-enabled
# once a certificate exists.

server {
    listen 80;
    listen [::]:80;
    server_name health-house.aljoodnet.info;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://admin-web:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
