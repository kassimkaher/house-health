# api-health-house.aljoodnet.info — proxies to the api container. TLS-ready:
# this file is the HTTP-only version served from first boot.
# scripts/enable-tls.sh replaces it with api.conf.https-enabled once a
# certificate exists (docs/runbooks/tls.md).

server {
    listen 80;
    listen [::]:80;
    server_name api-health-house.aljoodnet.info;

    include /etc/nginx/snippets/security-headers.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /metrics {
        # Prometheus scrape target — internal network only.
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://api:3100/metrics;
    }

    location /health/ {
        proxy_pass http://api:3100/health/;
    }

    location /api/v1/admin/imports {
        client_max_body_size 25m;
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://api:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://api:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_general burst=20 nodelay;
        client_max_body_size 1m;
        proxy_pass http://api:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }
}
