# s3.<domain> — proxies to MinIO so presigned PUT/GET URLs (signed by the
# api container against S3_PUBLIC_URL, see compose.base.yml) are reachable
# from the public internet. MinIO's own port is never published directly.
# HTTP-only version; scripts/enable-tls.sh installs s3.conf.https-enabled
# once a certificate exists.

server {
    listen 80;
    listen [::]:80;
    server_name s3-health-house.aljoodnet.info;

    include /etc/nginx/snippets/security-headers.conf;
    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Presigned URLs sign the exact path+query — do not rewrite either.
    }
}
