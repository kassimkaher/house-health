# Included in every server block (infrastructure/docker/compose.base.yml
# mounts this directory read-only into the Nginx container).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# Enabled only once TLS is live (scripts/enable-tls.sh uncomments the HTTPS
# server blocks in conf.d/*.conf) — HSTS on plain HTTP would be premature.
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
